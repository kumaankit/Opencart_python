[pytest] 


# Fail collection when parametrized test data is empty
empty_parameter_set_mark = fail_at_collect 


# Default test files to collect
testpaths = 
    tests/test_registration.py
    tests/test_loginpage.py
    tests/test_productpage.py
    tests/test_searchpage.py    
    tests/test_Addtocart_page.py
    tests/test_checkout_page.py
    tests/test_Logout_page.py



addopts = 
    
    # Detailed test results
    -v                 
    
    
    # Browser and application URL
    --browser=msedge
    --base-url=https://tutorialsninja.com/demo/


    # Uncomment to show the browser window
    --headed
    

 
    # Captures and Reports (Debugging)
     --video=retain-on-failure 
    --screenshot=only-on-failure 
    --tracing=retain-on-failure  
    
    
    
   # Generate one standalone HTML report
    --html=reports/myreport.html
    --self-contained-html

   
    # Parallel Execution, requires pytest-xdist
    #-n=1              #Run through one worker process. No multi-worker speedup.
    #--numprocesses=2  #Run with two workers. Equivalent to -n 2.

 
    
    
    # Test Grouping (Markers)
    # Use one of the below commands when running pytest:
    #-m "sanity"
    # -m "regression"
    # -m "sanity or regression"
    # -m "sanity and regression"
    # -m "sanity and not regression"
    # -m "regression and not sanity"
    #-m "datadriven"
    #-m "end_to_end"

    
    
    # Flaky Test Handling, requires pytest-rerunfailures
    # ------------------------------
    #--reruns 2          #Retry a failed test up to twice: at most three attempts total.
    #--reruns-delay 2    #Wait two seconds between retries.





# Custom Markers
markers =
    sanity: marks a sanity test (basic quick check)
    regression: marks a regression test (full end-to-end validation)
    datadriven: marks a datadriven test
    end_to_end: marks an end-to-end test
